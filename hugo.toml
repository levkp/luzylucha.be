baseURL = 'https://luzylucha.be/'
title = 'Luz y Lucha'
theme = 'luzylucha'

defaultContentLanguage = 'nl'
defaultContentLanguageInSubdir = false
disableKinds = ['taxonomy', 'rss']

# Themes used to filter the creations. Term keys are shared by all languages;
# each tag has a page in content/tags/<key>/ with its name and intro text per language.
[taxonomies]
  tag = 'tags'

[permalinks.term]
  tags = '/works/tags/:contentbasename/'

# Allow {.class} on the line after a Markdown block, e.g. {.img-half} under an image.
[markup.goldmark.parser.attribute]
  block = true

[params]
  author = 'Lucia Dewitte'
  instagram = 'luzylucha'
  # Fill in to show an e-mail address in the footer and on the contact sections.
  email = ''
  # Tags shown in the filter on the creations page, in this order. Every tag here is
  # selectable, also when no creation uses it yet (it then shows an empty page).
  filterTags = ['baby-and-children', 'embroidery', 'patchwork', 'memories', 'upcycling']

[languages]
  [languages.nl]
    label = 'Nederlands'
    locale = 'nl-BE'
    weight = 1
    [languages.nl.params]
      description = 'Unieke textielcreaties: geborduurde broches en bijzondere gepersonaliseerde cadeaus, met liefde handgemaakt door Lucia Dewitte.'

  [languages.en]
    label = 'English'
    locale = 'en'
    weight = 2
    [languages.en.params]
      description = 'Unique textile creations: embroidered brooches and special personalised gifts, lovingly handmade by Lucia Dewitte.'

  [languages.fr]
    label = 'Français'
    locale = 'fr-BE'
    weight = 3
    [languages.fr.params]
      description = 'Créations textiles uniques : broches brodées et cadeaux personnalisés d’exception, faits main avec amour par Lucia Dewitte.'
